spring.application.name=mlb-api
spring.datasource.url=jdbc:postgresql://localhost:5432/mlb_db
spring.datasource.username=mlb_admin
spring.datasource.password=admin_password

# Tells Hibernate to validate the schema against our DB without altering it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true